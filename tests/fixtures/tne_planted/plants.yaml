# and >=15 near-miss negatives, each declaring the NATURAL identifier of its scoring unit
# (docs/specs/SKILL-001_test_specification.md §3). generate.py materialises these rows
# into the 8 source files verbatim -- it never decides which rows are exceptions.
#
# Row shapes:
#   {natural_id, exception, fields}            -- a single-row scoring unit
#   {natural_id, kind, group_keys, members}     -- a multi-row group scoring unit
