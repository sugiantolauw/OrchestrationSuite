# it is companion rows for another test's right-hand source (travel_request_segment,
# missing_receipt, attendee_validity), collected by generate.py the same way.
#
# Run `python tests/fixtures/tne_planted/generate.py` after any edit to this file to
# regenerate the committed sample under tests/fixtures/tne_planted/data/.

