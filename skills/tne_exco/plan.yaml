      match: exact
      flag: RF_ATT_HierarchyInvalid
      metrics:
        att_hierarchy_invalid: {kind: count}
        att_hierarchy_total: {kind: value, key: population_size}

  - test_id: T6.1d_dom
    control_id: CTL-TNE-13
    risk_id: RSK-TNE-13
