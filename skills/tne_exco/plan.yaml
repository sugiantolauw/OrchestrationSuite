      flags: [RF_CS_PersonalExpense]

  - test_id: T4.4
    control_id: CTL-TNE-08
    risk_id: RSK-TNE-08
    assertion: operating
    flag: RF_CS_Reimbursement_GT_5K
    primitive: threshold_exceedance
    params:
      population: p_exp_hv
      column: Expense Amount (reimbursement currency)
      limit: {threshold: high_value_limit}
      direction: above
      flag: RF_CS_Reimbursement_GT_5K
      metrics:
        hv_count: {kind: count}
        hv_amount: {kind: sum, column: Expense Amount (reimbursement currency), unit: AUD}
        hv_employees: {kind: distinct, column: Employee ID}

  - test_id: T5.1
    control_id: CTL-TNE-09
    risk_id: RSK-TNE-09
    assertion: operating
    flag: RF_CS_SplitClaims_SameDay
    primitive: split_detection
    params:
      population: p_exp_split
      group_keys: [Employee ID, Vendor, Expense Type]
      date_column: Transaction Date
      amount_column: Expense Amount (reimbursement currency)
      window_days: {threshold: split_window_days}
      aggregate_threshold: {threshold: split_aggregate_threshold}
      max_line: {threshold: high_value_limit}
      flag_same_day: RF_CS_SplitClaims_SameDay
      flag_window: RF_CS_SplitClaims_Window
      metrics:
        # B3: split_same_day_groups/split_window_groups are kind-specific
        # detection counts (not deduplicated against each other); split_groups
        # is the distinct claim-group population (a window group whose member
        # set equals a same-day group's counts once) -- the scored unit and
        # what findings.yaml cites for trigger/severity.
        split_same_day_groups: {kind: value, key: same_day_groups}
        split_window_groups: {kind: value, key: window_groups}
        split_groups: {kind: value, key: split_groups}
        split_lines: {kind: value, key: split_lines}
        split_amount: {kind: value, key: split_amount, unit: AUD}

  - test_id: T5.2
