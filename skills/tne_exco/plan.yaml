      instant_threshold: {threshold: instant_approval_minutes}
      receipts_viewed_date_column: Receipts Viewed Date
      approver_received_date_column: Approver Received Date
      approved_datetime_column: Approved Date/Time
      approver_id_column: Approver ID
      approver_name_column: Approver Name
      flag: RF_APR_InsufficientReview

  - test_id: T6.1c
    control_id: CTL-TNE-12
    risk_id: RSK-TNE-12
