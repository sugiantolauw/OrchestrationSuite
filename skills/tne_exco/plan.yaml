      limit: {threshold: very_late_booking_days}
      direction: below
      flag: RF_CS_VeryLateBooking
      metrics:
        very_late_booking_count: {kind: count}

  - test_id: T3.3b
    control_id: CTL-TNE-04
    risk_id: RSK-TNE-04
    assertion: operating
    flag: RF_CS_EntertainmentOverLimit
    primitive: ratio_per_group
    params:
      population: t33b_pop
      numerator_column: Entry Amount
      denominator_column: Number of Attendees
      group_by: [Employee ID, Report Name, Transaction Date, Vendor, Entry Amount]
      numerator_aggregate: first
      direction: above
      limit_selector_column: external
      # B5: external limit applies if ANY attendee of the entry is external
      # (spec T3.3b) -- 'any' picks the highest-precedence declared case
      # ('external', declared after 'internal') present anywhere in the group,
      # not just the first attendee row read.
      limit_selector_aggregate: any
      limit_cases:
        internal: {threshold: entertainment_internal_limit}
        external: {threshold: entertainment_external_limit}
      flag: RF_CS_EntertainmentOverLimit
      metrics:
        ent_assessed: {kind: value, key: assessed}
        ent_over_internal_count: {kind: value, key: count_internal}
        ent_over_external_count: {kind: value, key: count_external}
        ent_over_amount: {kind: sum, column: Entry Amount, unit: AUD}

  - test_id: T4.1
    control_id: CTL-TNE-05
    risk_id: RSK-TNE-05
    assertion: operating
    flag: RF_CS_MissingReceipt
    primitive: anti_join_gap
    params:
      left_population: p_exp
      right_population: missing_receipt_pop
      left_keys: [Employee ID, Report Legacy Key, Transaction Date, Expense Type, Expense Amount (reimbursement currency)]
      right_keys: [Employee ID, Report Legacy Key, Transaction Date, Expense Type, Expense Amount (reimbursement currency)]
      mode: semi
      carry_right_columns: [Has Affidavit]
      flag: RF_CS_MissingReceipt
      metrics:
        missing_receipt_count: {kind: count}
        missing_receipt_pct: {kind: pct_of_population}
        missing_receipt_amount: {kind: sum, column: Expense Amount (reimbursement currency), unit: AUD}
        missing_receipt_no_affidavit_count:
          kind: count_where
          where: {column: Has Affidavit, op: ne, value: "Yes"}
        t41_unmatched_register_rows: {kind: value, key: right_unmatched_count}

  - test_id: T4.2
    control_id: CTL-TNE-06
    risk_id: RSK-TNE-06
    assertion: operating
