        daily_over_employees_dom: {kind: distinct, column: Employee ID}
        daily_over_max_dom: {kind: max, column: Expense Amount (reimbursement currency), unit: AUD}
        # N4: ambiguous/conflicting city<->currency country derivation, surfaced
        # as a real run metric rather than computed-and-discarded (custom.py
        # country_from_city_or_currency).
        t61d_dom_city_currency_conflict_rows: {kind: value, key: t61d_city_currency_conflict_rows}

  - test_id: T6.1d_int
    control_id: CTL-TNE-13
