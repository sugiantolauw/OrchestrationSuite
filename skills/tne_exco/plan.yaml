      metrics:
        att_total: {kind: value, key: population_size}
        att_missing_count: {kind: count}
        att_missing_pct: {kind: pct_of_population}

  - test_id: T4.3
    control_id: CTL-TNE-07
    risk_id: RSK-TNE-07
    assertion: operating
    not_testable:
