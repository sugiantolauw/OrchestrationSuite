populations:
  # --- raw, unfiltered: one per contract source, for total_records / total_files
  # reconciliation reporting only. No test reads these directly. `amount_column`/
  # `date_column`, where a source has one unambiguous natural column of that
  # kind, additionally drives G6's Sigma(amount) and min/max-date reconciliation
  # (orchestrator.nodes.fieldwork.execute, CLAUDE.md §5 G6, P2/P3 gate review
  # item 2) -- independently re-verified against DataSourceAdapter.column_stats
  # at the same pinned version, never re-derived from the same in-memory frame.
  # Omitted where a source has no single natural amount/date column
  # (travel_request_segment, per_diem_rates: neither; approval_aging,
  # booking_detail: a date but no amount).
  raw_expense_report:
    source: expense_report
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date
  raw_attendee_validity:
    source: attendee_validity
    amount_column: Entry Amount
    date_column: Transaction Date
  raw_missing_receipt:
    source: missing_receipt
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date
  raw_approval_aging:
    source: approval_aging
    date_column: Approved Date/Time
  raw_travel_requests_no_expense:
    source: travel_requests_no_expense
    amount_column: Total Approved Amount (rpt)
    date_column: Start Date
  raw_travel_request_segment:
    source: travel_request_segment
  raw_booking_detail:
    source: booking_detail
    date_column: Depart Date
  raw_per_diem_rates:
    source: per_diem_rates

  # N7 (P2/P3 gate review item 6): CLAUDE.md §11's ExCo identity decision
  # excludes Employee ID 50040 ("Delacroix, Marie") as a namesake of ExCo ID
  # 52472 -- an authoring-time judgement (exco.yaml), disclosed here as a
  # LIVE, run-computed materiality figure rather than the static "27 claims"
  # comment it was decided from, so a later change in the bound data would
  # show up rather than staying silently stale. Unfiltered by period,
  # matching claims_prepared/approved/combined's own scope below.
  p_exco_excluded_namesakes:
    source: expense_report
    filters:
      - column: Employee ID
        op: in
        value: {ref: exco_namesake_excluded_ids}
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # --- P_EXP family (spec §0 "Expense population P_EXP") ---
  # role sets, unfiltered by period -- run-level claims_prepared/approved/combined
  # reporting reads these populations' own rows/amount directly, never a hardcoded
  # constant (CLAUDE.md §0.2, computation.py:641-642).
  p_exp_prepared_all:
    source: expense_report
    filters:
      - column: Employee ID
        op: in
        value: {ref: exco_employee_ids}
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  p_exp_approved_all:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - column: cross_approver_id
        op: in
        value: {ref: exco_employee_ids}
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  p_exp_both_all:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - column: Employee ID
            op: in
            value: {ref: exco_employee_ids}
          - column: cross_approver_id
            op: in
            value: {ref: exco_employee_ids}
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # The combined population (role union), in period -- used by every P_EXP test
  # except T6.1d (prepared-only, spec [PENDING] population note).
  p_exp:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - any_of:
              - column: Employee ID
                op: in
                value: {ref: exco_employee_ids}
              - column: cross_approver_id
                op: in
                value: {ref: exco_employee_ids}
          - column: Transaction Date
            op: between
            value: {ref: audit_period}
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # Prepared-only, in period -- T6.1d's population (spec [PENDING]: prepared by
  # ExCo, not the approved set, since daily spend is the traveller's own).
  p_exp_prepared:
    source: expense_report
    filters:
      - column: Employee ID
        op: in
        value: {ref: exco_employee_ids}
      - column: Transaction Date
        op: between
        value: {ref: audit_period}
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # p_exp plus the T5.1 vendor exclusion and positive-amount filter (negative/zero
  # rows cannot split a claim -- spec §0 "Negative and zero amounts").
  p_exp_split:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - any_of:
              - column: Employee ID
                op: in
                value: {ref: exco_employee_ids}
              - column: cross_approver_id
                op: in
                value: {ref: exco_employee_ids}
          - column: Transaction Date
            op: between
            value: {ref: audit_period}
      - column: Vendor
        op: not_in
        value: {ref: split_exclusions}
      - column: Expense Amount (reimbursement currency)
        op: gt
        value: 0
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # p_exp plus the T4.4 positive-amount filter (spec T4.4 "Population: P_EXP,
  # amount > 0" -- N5: excluded count reported at p_exp_hv.excluded.*).
  p_exp_hv:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - any_of:
              - column: Employee ID
                op: in
                value: {ref: exco_employee_ids}
              - column: cross_approver_id
                op: in
                value: {ref: exco_employee_ids}
          - column: Transaction Date
            op: between
            value: {ref: audit_period}
      - column: Expense Amount (reimbursement currency)
        op: gt
        value: 0
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # p_exp plus the T5.2 positive-amount filter.
  p_exp_dup:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - any_of:
              - column: Employee ID
                op: in
                value: {ref: exco_employee_ids}
              - column: cross_approver_id
                op: in
                value: {ref: exco_employee_ids}
          - column: Transaction Date
            op: between
            value: {ref: audit_period}
      - column: Expense Amount (reimbursement currency)
        op: gt
        value: 0
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # T3.2a sub-populations: p_exp scoped to one supplier category + class, vendor
  # FCM excluded (agency charge, not a supplier -- spec T3.2a).
  p_exp_pref_air_dom:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - any_of:
              - column: Employee ID
                op: in
                value: {ref: exco_employee_ids}
              - column: cross_approver_id
                op: in
                value: {ref: exco_employee_ids}
          - column: Transaction Date
            op: between
            value: {ref: audit_period}
      - column: Expense Type
        op: eq
        value: "Airfares - Domestic Travel"
      - column: Vendor
        op: ne
        value: FCM
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  p_exp_pref_air_int:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - any_of:
              - column: Employee ID
                op: in
                value: {ref: exco_employee_ids}
              - column: cross_approver_id
                op: in
                value: {ref: exco_employee_ids}
          - column: Transaction Date
            op: between
            value: {ref: audit_period}
      - column: Expense Type
        op: eq
        value: "Airfares - International Travel"
      - column: Vendor
        op: ne
        value: FCM
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  p_exp_pref_car_dom:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - any_of:
              - column: Employee ID
                op: in
                value: {ref: exco_employee_ids}
              - column: cross_approver_id
                op: in
                value: {ref: exco_employee_ids}
          - column: Transaction Date
            op: between
            value: {ref: audit_period}
      - column: Expense Type
        op: eq
        value: "Car Rentals - Domestic Travel"
      - column: Vendor
        op: ne
        value: FCM
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  p_exp_pref_car_int:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - any_of:
              - column: Employee ID
                op: in
                value: {ref: exco_employee_ids}
              - column: cross_approver_id
                op: in
                value: {ref: exco_employee_ids}
          - column: Transaction Date
            op: between
            value: {ref: audit_period}
      - column: Expense Type
        op: eq
        value: "Car Rental – International Travel"
      - column: Vendor
        op: ne
        value: FCM
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # T6.1d: p_exp_prepared scoped to Meals/Incidentals expense types, with a
  # derived country and derived per-diem AUD limit (spec T6.1d).
  # No filter here depends on a derived column, so the derivation runs AFTER
  # filtering (plain `derive`, not `pre_filter_derive`) -- unlike t61d_pop_dom/
  # t61d_pop_int below, whose country-based filter forces derive-before-filter.
  # This keeps t61d_unmapped_rows / t61d_country_not_in_per_diem_table scoped to
  # the true tested population (Meals/Incidentals, ExCo, in period) rather than
  # the whole raw source.
  t61d_pop:
    source: expense_report
    filters:
      - column: Employee ID
        op: in
        value: {ref: exco_employee_ids}
      - column: Transaction Date
        op: between
        value: {ref: audit_period}
      - column: Expense Type
        op: in
        value:
          - "Meals - Domestic Travel"
          - "Meals - International Travel"
          - "Incidentals - Domestic Travel"
          - "Incidentals - International Travel"
      # N5: negative/zero amounts (credits/reversals) are excluded from the T6.1d
      # population rather than netted into the daily sum -- a credit is not a
      # spend event, and summing it against same-day spend hides the true daily
      # total. Excluded count is reported at t61d_pop.excluded.* (populations.py).
      - column: Expense Amount (reimbursement currency)
        op: gt
        value: 0
    derive:
      - op: custom
        name: country_from_city_or_currency
        as: country
        params:
          city_table: city_country
          currency_table: currency_country
      - op: month
        column: Transaction Date
        as: transaction_month
      - op: lookup
        table: per_diem_rates
        "on": [country]
        ref_on: ["Country/Region"]
        value_column: "Rate Per Day (S$)"
        as: rate_per_day_sgd
        unmapped_counter: t61d_country_not_in_per_diem_table
      - op: fx_rate
        table: monthly_aud_sgd_rate
        month_column: transaction_month
        key_column: month
        value_column: aud_per_sgd_factor
        as: aud_per_sgd_factor
      - op: multiply
        left: {column: rate_per_day_sgd}
        right: {column: aud_per_sgd_factor}
        as: daily_limit_aud
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # Two-phase build (filter -> derive -> post_filter, P2b-1 fix): `filters` runs
  # first on raw columns (ExCo, in-period, Meals/Incidentals), THEN `derive`
  # computes country/limit -- so t61d_*_country_not_in_per_diem_table and
  # t61d_unmapped_rows are scoped to the true tested population, not the whole
  # raw expense_report source -- and only then does `post_filter` split on the
  # derived `country` column. Same exceedance TEST result as before; the
  # data-quality counters are now correctly scoped (populations.py, engine.py).
  t61d_pop_dom:
    source: expense_report
    filters:
      - column: Employee ID
        op: in
        value: {ref: exco_employee_ids}
      - column: Transaction Date
        op: between
        value: {ref: audit_period}
      - column: Expense Type
        op: in
        value:
          - "Meals - Domestic Travel"
          - "Meals - International Travel"
          - "Incidentals - Domestic Travel"
          - "Incidentals - International Travel"
      # N5: see t61d_pop above -- credits must not net into the daily sum.
      - column: Expense Amount (reimbursement currency)
        op: gt
        value: 0
    derive:
      - op: custom
        name: country_from_city_or_currency
        as: country
        params:
          city_table: city_country
          currency_table: currency_country
      - op: month
        column: Transaction Date
        as: transaction_month
      - op: lookup
        table: per_diem_rates
        "on": [country]
        ref_on: ["Country/Region"]
        value_column: "Rate Per Day (S$)"
        as: rate_per_day_sgd
        unmapped_counter: t61d_dom_country_not_in_per_diem_table
      - op: fx_rate
        table: monthly_aud_sgd_rate
        month_column: transaction_month
        key_column: month
        value_column: aud_per_sgd_factor
        as: aud_per_sgd_factor
      - op: multiply
        left: {column: rate_per_day_sgd}
        right: {column: aud_per_sgd_factor}
        as: daily_limit_aud
    post_filter:
      - column: country
        op: eq
        value: Australia
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  t61d_pop_int:
    source: expense_report
    filters:
      - column: Employee ID
        op: in
        value: {ref: exco_employee_ids}
      - column: Transaction Date
        op: between
        value: {ref: audit_period}
      - column: Expense Type
        op: in
        value:
          - "Meals - Domestic Travel"
          - "Meals - International Travel"
          - "Incidentals - Domestic Travel"
          - "Incidentals - International Travel"
      # N5: see t61d_pop above -- credits must not net into the daily sum.
      - column: Expense Amount (reimbursement currency)
        op: gt
        value: 0
    derive:
      - op: custom
        name: country_from_city_or_currency
        as: country
        params:
          city_table: city_country
          currency_table: currency_country
      - op: month
        column: Transaction Date
        as: transaction_month
      - op: lookup
        table: per_diem_rates
        "on": [country]
        ref_on: ["Country/Region"]
        value_column: "Rate Per Day (S$)"
        as: rate_per_day_sgd
        unmapped_counter: t61d_int_country_not_in_per_diem_table
      - op: fx_rate
        table: monthly_aud_sgd_rate
        month_column: transaction_month
        key_column: month
        value_column: aud_per_sgd_factor
        as: aud_per_sgd_factor
      - op: multiply
        left: {column: rate_per_day_sgd}
        right: {column: aud_per_sgd_factor}
        as: daily_limit_aud
    post_filter:
      - all_of:
          - column: country
            op: not_null
          - column: country
            op: ne
            value: Australia
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # T3.1a: travel_requests_no_expense scoped to ExCo, in period, linked-status.
  t31a_pop:
    source: travel_requests_no_expense
    filters:
      - column: Employee
        op: in
        value: {ref: exco_display_names}
      - column: Start Date
        op: between
        value: {ref: audit_period}
      - column: Approval Status
        op: in
        value: ["Approved", "Approved - Pending Booking"]
    amount_column: Total Approved Amount (rpt)
    date_column: Start Date

  # T3.1b / T3.2a / T3.3a: booking_detail scoped to ExCo, in period, not cancelled,
  # with a derived travel class (Dom|Int -> Dom/Int -- spec T3.1b join key).
  t31b_bookings_pop:
    source: booking_detail
    derive:
      - op: map
        column: Dom | Int
        mapping:
          Domestic: Dom
          International: Int
          Trans Tasman: Int
        as: class
    filters:
      - column: Lead Traveller Name
        op: in
        value: {ref: exco_display_names}
      - column: Depart Date
        op: between
        value: {ref: audit_period}
      - column: Booking Status
        op: ne
        value: Cancelled
    date_column: Depart Date

  # Right side of the T3.1b anti-join: travel requests scoped to ExCo names, with
  # the same class derivation from Expense Type.
  t31b_requests_pop:
    source: travel_request_segment
    derive:
      - op: map
        column: Expense Type
        mapping:
          "Airfares - Domestic Travel": Dom
          "Accommodation - Domestic Travel": Dom
          "Car Rentals - Domestic Travel": Dom
          "Airfares - International Travel": Int
          "Accommodation - International Travel": Int
          "Car Rental – International Travel": Int
        as: class
    filters:
      - column: Employee
        op: in
        value: {ref: exco_display_names}

  # T3.3b: attendee_validity scoped to ExCo claimants, in period, entertainment
  # expense types (spec T3.3b).
  t33b_pop:
    source: attendee_validity
    derive:
      - op: custom
        name: attendee_external_classification
        as: external
    filters:
      - column: Employee ID
        op: in
        value: {ref: exco_employee_ids}
      - column: Transaction Date
        op: between
        value: {ref: audit_period}
      - column: Expense Type
        op: in
        value:
          - "Staff/Client Function: Offsite Food/Drink"
          - "Staff/Client Function: Onsite Food/Drink"
    amount_column: Entry Amount
    date_column: Transaction Date

  # T4.2: entertainment-type P_EXP lines (spec [PENDING]: gifts excluded, no attendees).
  t42_pop:
    source: expense_report
    pre_filter_derive:
      - op: custom
        name: cross_approver_numeric
        as: cross_approver_id
    filters:
      - all_of:
          - any_of:
              - column: Employee ID
                op: in
                value: {ref: exco_employee_ids}
              - column: cross_approver_id
                op: in
                value: {ref: exco_employee_ids}
          - column: Transaction Date
            op: between
            value: {ref: audit_period}
      - column: Expense Type
        op: in
        value:
          - "Staff/Client Function: Offsite Food/Drink"
          - "Staff/Client Function: Onsite Food/Drink"
          - "Staff/Client Function: No Food/No Drink"
    amount_column: Expense Amount (reimbursement currency)
    date_column: Transaction Date

  # T6.1a: approval_aging scoped to ExCo approvers, in period.
  t61a_pop:
    source: approval_aging
    filters:
      - column: Approver ID
        op: in
        value: {ref: exco_employee_ids}
      - column: Approved Date/Time
        op: between
        value: {ref: audit_period}

  # T6.1c: attendee_validity scoped to ExCo claimants, in period.
  t61c_pop:
    source: attendee_validity
    filters:
      - column: Employee ID
        op: in
        value: {ref: exco_employee_ids}
      - column: Transaction Date
        op: between
        value: {ref: audit_period}

  # missing_receipt register -- unscoped; T4.1 anti-joins it against p_exp, so
  # scoping this side by ExCo would double-restrict nothing (the join key
  # includes Employee ID) but is left open so t41_unmatched_register_rows means
  # "unmatched anywhere in the register", not "unmatched within a pre-filtered
  # slice" -- matches spec T4.1.
  missing_receipt_pop:
    source: missing_receipt

# /workspace/tne row-snapshot tagging (orchestrator/frames.py, CLAUDE.md build
# brief P4 perf fix) -- tags each expense_report snapshot row with the P_EXP
# role it was in (spec §0 "Expense population P_EXP": prepared / approved /
# both), reusing the same role-set populations run_metrics.claims_prepared/
# claims_approved/claims_combined already read (unfiltered by period, matching
# their own scope) rather than re-deriving role from Employee ID/cross_approver_id
# a second time. Checked in this order -- "both" first, since it is the
# intersection of the other two and must win over either alone.
frame_tags:
  role:
    source: expense_report
    from:
      both: p_exp_both_all
      prepared: p_exp_prepared_all
      approved: p_exp_approved_all

tests:
  - test_id: T3.1a
    control_id: CTL-TNE-01
    risk_id: RSK-TNE-01
    assertion: operating
    flag: RF_PRE_Unlinked
    primitive: list_membership
    params:
      population: t31a_pop
      column: Approval Status
      allowed_values: ["Approved", "Approved - Pending Booking"]
      negate: false
      match: exact
      flag: RF_PRE_Unlinked
      metrics:
        preapproval_unlinked_count: {kind: count}
        preapproval_unlinked_amount: {kind: sum, column: Total Approved Amount (rpt), unit: AUD}
        preapproval_employees: {kind: distinct, column: Employee}

  - test_id: T3.1b
    control_id: CTL-TNE-01
    risk_id: RSK-TNE-01
    assertion: operating
    flag: RF_CS_NoPreapproval
    primitive: anti_join_gap
    params:
      left_population: t31b_bookings_pop
      right_population: t31b_requests_pop
      left_keys: [Lead Traveller Name, class]
      right_keys: [Employee, class]
      mode: anti
      flag: RF_CS_NoPreapproval
      metrics:
        no_preapproval_bookings: {kind: count}
        no_preapproval_employees: {kind: distinct, column: Lead Traveller Name}
        t31b_name_match_rate: {kind: match_rate}

  - test_id: T3.2a_air_dom
    control_id: CTL-TNE-02
    risk_id: RSK-TNE-02
    assertion: operating
    flag: RF_SP_DomAirline_NotPreferred
    primitive: list_membership
    params:
      population: p_exp_pref_air_dom
      column: Vendor
      allowed_values: {ref: preferred_airlines}
      negate: true
      match: whole_word_upper
      flag: RF_SP_DomAirline_NotPreferred
      metrics:
        pref_dom_airline: {kind: count}

  - test_id: T3.2a_air_int
    control_id: CTL-TNE-02
    risk_id: RSK-TNE-02
    assertion: operating
    flag: RF_SP_IntAirline_NotPreferred
    primitive: list_membership
    params:
      population: p_exp_pref_air_int
      column: Vendor
      allowed_values: {ref: preferred_airlines}
      negate: true
      match: whole_word_upper
      flag: RF_SP_IntAirline_NotPreferred
      metrics:
        pref_int_airline: {kind: count}

  - test_id: T3.2a_car_dom
    control_id: CTL-TNE-02
    risk_id: RSK-TNE-02
    assertion: operating
    flag: RF_SP_DomCarRental_NotPreferred
    primitive: list_membership
    params:
      population: p_exp_pref_car_dom
      column: Vendor
      allowed_values: {ref: preferred_car}
      negate: true
      match: whole_word_upper
      flag: RF_SP_DomCarRental_NotPreferred
      metrics:
        pref_dom_car: {kind: count}

  - test_id: T3.2a_car_int
    control_id: CTL-TNE-02
    risk_id: RSK-TNE-02
    assertion: operating
    flag: RF_SP_IntCarRental_NotPreferred
    primitive: list_membership
    params:
      population: p_exp_pref_car_int
      column: Vendor
      allowed_values: {ref: preferred_car}
      negate: true
      match: whole_word_upper
      flag: RF_SP_IntCarRental_NotPreferred
      metrics:
        pref_int_car: {kind: count}

  - test_id: T3.2a_accom
    control_id: CTL-TNE-02
    risk_id: RSK-TNE-02
    assertion: operating
    not_testable:
      reason: "no preferred-hotel list supplied (spec T3.2a)"
      # N11: declared so the engine can emit these as all-null (never 0)
      # columns in the flags frame -- P4 renders a null RF_* value as "Not
      # tested", distinct from a real 0/false "No breach".
      flags: [RF_SP_DomAccom_NotPreferred, RF_SP_IntAccom_NotPreferred]

  - test_id: T3.3a_dom
    control_id: CTL-TNE-03
    risk_id: RSK-TNE-03
    assertion: operating
    flag: RF_CS_LateBooking
    primitive: threshold_exceedance
    params:
      population: t31b_bookings_pop
      column: Advance Purchase Days
      limit: {threshold: late_booking_domestic_days}
      direction: below
      exclude: {column: class, op: ne, value: Dom}
      flag: RF_CS_LateBooking
      metrics:
        late_booking_count_dom: {kind: count}
        late_booking_employees_dom: {kind: distinct, column: Lead Traveller Name}

  - test_id: T3.3a_int
    control_id: CTL-TNE-03
    risk_id: RSK-TNE-03
    assertion: operating
    flag: RF_CS_LateBooking
    primitive: threshold_exceedance
    params:
      population: t31b_bookings_pop
      column: Advance Purchase Days
      limit: {threshold: late_booking_international_days}
      direction: below
      exclude: {column: class, op: ne, value: Int}
      flag: RF_CS_LateBooking
      metrics:
        late_booking_count_int: {kind: count}
        late_booking_employees_int: {kind: distinct, column: Lead Traveller Name}

  - test_id: T3.3a_very_late
    control_id: CTL-TNE-03
    risk_id: RSK-TNE-03
    assertion: operating
