timezone: Australia/Sydney
sources:
  expense_report:
    format: xlsx
    sheet: data
    file: Expense_Report_Combined.xlsx
    header_trim: false
    # Independent review (2026-09-24), item 1: this source is ROW-GRAIN (one
    # row = one distinct transaction entry) -- 4,049 of its rows genuinely
    # share the 5-column tuple this contract used to declare as `entry_key`
    # (same employee/report/date/type/amount, e.g. recurring telco charges),
    # so treating that tuple as unique silently collapsed real, distinct
    # spend in the run headline (prioritise's own de-duplication assumed
    # uniqueness it never checked). No entry_key is declared here: a
    # row-grain source's line identity for headline de-duplication is its
    # own row identity (source, row_key) -- see
    # orchestrator.nodes.fieldwork.prioritise. `entry_key` is reserved for a
    # source whose grain genuinely repeats (attendee_validity, below).
    columns:
      Employee:
        type: string
        nullable: false
        pii: true
      Employee ID:
        type: integer
        nullable: false
        pii: true
      Employee ID(Cross Change Approver):
        type: string
        nullable: true
        pii: true
      Report Legacy Key:
        type: integer
        nullable: false
      Report Name:
        type: string
        nullable: false
      Transaction Date:
        type: date
        nullable: false
      Expense Type:
        type: string
        nullable: false
        trim_values: true
      Vendor:
        type: string
        nullable: true
        trim_values: true
      Parent Key:
        type: integer
        nullable: false
      Payment Type:
        type: string
        nullable: false
        trim_values: true
      Reimbursement Currency:
        type: string
        nullable: false
        trim_values: true
        required_values: [AUD]
      Expense Amount (reimbursement currency):
        type: number
        nullable: false
      Transaction Currency:
        type: string
        nullable: false
        trim_values: true
      City/Location:
        type: string
        nullable: true
        trim_values: true

  attendee_validity:
    format: xlsx
    sheet: Sheet1
    file: Attendee_Validity_Report.xlsx
    header_trim: false
    # B2: T3.3b's own "Entry identity" (spec T3.3b) -- this source is
    # attendee-grain (one row per attendee of one entertainment entry), so
    # several flagged rows legitimately share one entry_key; the headline's
    # de-duplication collapses them to that single entry, never summing the
    # same Entry Amount once per attendee. `entry_key_repeats: true` records
    # that this repetition is DECLARED and expected (independent review
    # 2026-09-24, item 1) -- prioritise() treats a source with entry_key but
    # no entry_key_repeats as a source that is supposed to be unique per row,
    # and fails the run if it is not (the check expense_report's own
    # mis-declared entry_key should have had).
    entry_key: [Employee ID, Report Name, Transaction Date, Vendor, Entry Amount]
    entry_key_repeats: true
    columns:
      Employee ID:
        type: integer
        nullable: false
        pii: true
      Report Name:
        type: string
        nullable: false
      Attendee Name:
        type: string
        nullable: false
        pii: true
      Expense Type:
        type: string
        nullable: false
        trim_values: true
      Vendor:
        type: string
        nullable: false
        trim_values: true
      Transaction Date:
        type: date
        nullable: false
      Is Attendee also in Hierarchy?:
        type: string
        nullable: false
        trim_values: true
      Number of Attendees:
        type: integer
        nullable: false
      Entry Amount:
        type: number
        nullable: false
      External ID:
        type: integer
        nullable: false
      Company:
        type: string
        nullable: true

  missing_receipt:
    format: xlsx
    sheet: Sheet1
    file: Claims_Missing_Receipt_Affidavit.xlsx
    header_trim: false
    columns:
      Employee ID:
        type: integer
        nullable: false
        pii: true
      Report Legacy Key:
        type: integer
        nullable: false
      Transaction Date:
        type: date
        nullable: false
      Expense Type:
        type: string
        nullable: false
        trim_values: true
      Expense Amount (reimbursement currency):
        type: number
        nullable: false
      Reimbursement Currency:
        type: string
        nullable: false
        trim_values: true
        required_values: [AUD]
      Has Affidavit:
        type: string
        nullable: false
        trim_values: true

  approval_aging:
    format: xlsx
    sheet: Sheet1
    file: Approval_Aging_Receipt_Viewed.xlsx
    header_trim: false
    columns:
      Report ID:
        type: string
        nullable: false
      Approver ID:
        type: integer
        nullable: false
        pii: true
      Approver Name:
        type: string
        nullable: false
        pii: true
      Step:
        type: string
        nullable: false
        trim_values: true
      Approved Date/Time:
        type: datetime
        nullable: false
      Approver Received Date:
        type: datetime
        nullable: false
      Report Receipt Viewed:
        type: string
        nullable: false
        trim_values: true
      All Entry Receipts Viewed:
        type: string
        nullable: false
        trim_values: true
      Minutes of Approval from Receipt View:
        type: integer
        nullable: false
      Receipts Viewed Date:
        type: datetime
        nullable: true
      Reimbursement Currency:
        type: string
        nullable: false
        trim_values: true
        required_values: [AUD]

  travel_requests_no_expense:
    format: xlsx
    sheet: Sheet1
    file: Travel_Requests_Without_Expense.xlsx
    header_trim: false
    columns:
      Employee:
        type: string
        nullable: false
        trim_values: true
        pii: true
      Travel Request ID:
        type: string
        nullable: false
      Approval Status:
        type: string
        nullable: false
        trim_values: true
      Start Date:
        type: date
        nullable: false
      Total Approved Amount (rpt):
        type: number
        nullable: false

  travel_request_segment:
    format: xlsx
    sheet: Sheet1
    file: Travel_Request_by_Segment.xlsx
    header_trim: false
    columns:
      Employee:
        type: string
        nullable: false
        trim_values: true
        pii: true
      Expense Type:
        type: string
        nullable: false
        trim_values: true

  booking_detail:
    format: xlsx
    sheet: Sheet1
    file: Booking_Detail_Report.xlsx
    header_trim: true
    columns:
      Lead Traveller Name:
        type: string
        nullable: false
        trim_values: true
        pii: true
      Booking ID:
        type: integer
        nullable: false
      Dom | Int:
        type: string
        nullable: false
        trim_values: true
      Advance Purchase Days:
        type: integer
        nullable: false
      Booking Status:
        type: string
        nullable: false
        trim_values: true
      Depart Date:
        type: date
        nullable: false
      Currency:
        type: string
        nullable: false
        trim_values: true
        required_values: [AUD]

  per_diem_rates:
    format: csv
    file: Complete_Per_Diem_Rates_by_Country_Region.csv
    header_trim: false
    columns:
      Country/Region:
        type: string
        nullable: false
      Rate Per Day (S$):
        type: number
        nullable: false

# Independent review 2026-09-25 item 1 ("run inputs" -- docs/specs/
# P7_mapping_authoring_design.md §1.3): the population of interest is three
# references (exco_employee_ids, exco_display_names, exco_namesake_excluded_
# ids -- reference/exco.yaml's "active"/"excluded_pending_confirmation" split,
# CLAUDE.md §11 data decision 1), so overriding the ID list without the
# matching display names would silently break plan.yaml's name-only joins
# (T3.1a/T3.1b/T3.2a/T3.3a). All three are declared in one group: a run that
# overrides any of them must override all three together
# (orchestrator.run_inputs.resolve_run_inputs enforces this). No SOURCE_BINDINGS
# entry in this environment overrides them today (docs/specs/
# P7_mapping_authoring_design.md D-P7-4) -- this block only declares what a
# future project MAY override, explicitly, never by fuzzy inference.
parameters:
  exco_employee_ids:
    references: [exco_employee_ids]
    kind: id_list
    item_type: integer
    group: population_of_interest
  exco_display_names:
    references: [exco_display_names]
    kind: id_list
    item_type: string
    group: population_of_interest
  exco_namesake_excluded_ids:
    references: [exco_namesake_excluded_ids]
    kind: id_list
    item_type: integer
    group: population_of_interest
