timezone: Australia/Sydney
sources:
  expense_report:
    format: xlsx
    sheet: data
    file: Expense_Report_Combined.xlsx
    header_trim: false
    # B2 (CLAUDE.md P2/P3 gate review): the transaction entry key for this
    # source's run headline de-duplication (orchestrator.nodes.fieldwork.
    # prioritise) -- real declared columns, never a positional row index.
    # T4.1's own semi-join key to the missing_receipt register (spec T4.1,
    # docs/specs/SKILL-001_test_specification.md), sharpened with the report
    # key so two genuinely distinct lines that happen to share employee/date/
    # type/amount (but belong to different reports) are never collapsed into
    # one entry -- and, deliberately, so two T5.2 DUPLICATE lines (same
    # employee/date/vendor/amount but DIFFERENT Report Legacy Key, since a
    # duplicate is a second, separate submission) are never collapsed either:
    # both are real, distinct reimbursement events.
    entry_key: [Employee ID, Report Legacy Key, Transaction Date, Expense Type, Expense Amount (reimbursement currency)]
    columns:
      Employee:
        type: string
        nullable: false
        pii: true
      Employee ID:
        type: integer
        nullable: false
        pii: true
      Employee ID(Cross Change Approver):
        type: string
        nullable: true
        pii: true
      Report Legacy Key:
        type: integer
        nullable: false
      Report Name:
        type: string
        nullable: false
      Transaction Date:
        type: date
        nullable: false
      Expense Type:
        type: string
        nullable: false
        trim_values: true
      Vendor:
        type: string
        nullable: true
        trim_values: true
      Parent Key:
        type: integer
        nullable: false
      Payment Type:
        type: string
        nullable: false
        trim_values: true
      Reimbursement Currency:
        type: string
        nullable: false
        trim_values: true
        required_values: [AUD]
      Expense Amount (reimbursement currency):
        type: number
        nullable: false
      Transaction Currency:
        type: string
        nullable: false
        trim_values: true
      City/Location:
        type: string
        nullable: true
        trim_values: true

  attendee_validity:
    format: xlsx
    sheet: Sheet1
    file: Attendee_Validity_Report.xlsx
    header_trim: false
    # B2: T3.3b's own "Entry identity" (spec T3.3b) -- this source is
    # attendee-grain (one row per attendee of one entertainment entry), so
    # several flagged rows legitimately share one entry_key; the headline's
    # de-duplication collapses them to that single entry, never summing the
    # same Entry Amount once per attendee.
    entry_key: [Employee ID, Report Name, Transaction Date, Vendor, Entry Amount]
    columns:
      Employee ID:
        type: integer
        nullable: false
        pii: true
      Report Name:
        type: string
        nullable: false
      Attendee Name:
        type: string
        nullable: false
        pii: true
      Expense Type:
        type: string
        nullable: false
        trim_values: true
      Vendor:
        type: string
        nullable: false
        trim_values: true
      Transaction Date:
        type: date
        nullable: false
      Is Attendee also in Hierarchy?:
        type: string
        nullable: false
        trim_values: true
      Number of Attendees:
        type: integer
        nullable: false
      Entry Amount:
        type: number
        nullable: false
      External ID:
        type: integer
        nullable: false
      Company:
        type: string
        nullable: true

  missing_receipt:
    format: xlsx
    sheet: Sheet1
    file: Claims_Missing_Receipt_Affidavit.xlsx
    header_trim: false
    columns:
      Employee ID:
        type: integer
        nullable: false
        pii: true
      Report Legacy Key:
        type: integer
        nullable: false
      Transaction Date:
        type: date
        nullable: false
      Expense Type:
        type: string
        nullable: false
        trim_values: true
      Expense Amount (reimbursement currency):
        type: number
        nullable: false
      Reimbursement Currency:
        type: string
        nullable: false
        trim_values: true
        required_values: [AUD]
      Has Affidavit:
        type: string
        nullable: false
        trim_values: true

  approval_aging:
    format: xlsx
    sheet: Sheet1
    file: Approval_Aging_Receipt_Viewed.xlsx
    header_trim: false
    columns:
      Report ID:
        type: string
        nullable: false
      Approver ID:
        type: integer
        nullable: false
        pii: true
      Approver Name:
        type: string
        nullable: false
        pii: true
      Step:
        type: string
        nullable: false
        trim_values: true
      Approved Date/Time:
        type: datetime
        nullable: false
      Approver Received Date:
        type: datetime
        nullable: false
      Report Receipt Viewed:
        type: string
        nullable: false
        trim_values: true
      All Entry Receipts Viewed:
        type: string
        nullable: false
        trim_values: true
      Minutes of Approval from Receipt View:
        type: integer
        nullable: false
      Receipts Viewed Date:
        type: datetime
        nullable: true
      Reimbursement Currency:
        type: string
        nullable: false
        trim_values: true
        required_values: [AUD]

  travel_requests_no_expense:
    format: xlsx
    sheet: Sheet1
    file: Travel_Requests_Without_Expense.xlsx
    header_trim: false
    columns:
      Employee:
        type: string
        nullable: false
        trim_values: true
        pii: true
      Travel Request ID:
        type: string
        nullable: false
      Approval Status:
        type: string
        nullable: false
        trim_values: true
      Start Date:
        type: date
        nullable: false
      Total Approved Amount (rpt):
        type: number
        nullable: false

  travel_request_segment:
    format: xlsx
    sheet: Sheet1
    file: Travel_Request_by_Segment.xlsx
    header_trim: false
    columns:
      Employee:
        type: string
        nullable: false
        trim_values: true
        pii: true
      Expense Type:
        type: string
        nullable: false
        trim_values: true

  booking_detail:
    format: xlsx
    sheet: Sheet1
    file: Booking_Detail_Report.xlsx
    header_trim: true
    columns:
      Lead Traveller Name:
        type: string
        nullable: false
        trim_values: true
        pii: true
      Booking ID:
        type: integer
        nullable: false
      Dom | Int:
        type: string
        nullable: false
        trim_values: true
      Advance Purchase Days:
        type: integer
        nullable: false
      Booking Status:
        type: string
        nullable: false
        trim_values: true
      Depart Date:
        type: date
        nullable: false
      Currency:
        type: string
        nullable: false
        trim_values: true
        required_values: [AUD]

  per_diem_rates:
    format: csv
    file: Complete_Per_Diem_Rates_by_Country_Region.csv
    header_trim: false
    columns:
      Country/Region:
        type: string
        nullable: false
      Rate Per Day (S$):
        type: number
        nullable: false
