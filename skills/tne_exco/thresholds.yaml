# Every threshold plan.yaml or findings.yaml references. None has a real policy
# source yet (CLAUDE.md §0.4) -- all analyst-set, pending_policy_confirmation: true,
# recorded 2026-09-23 (P2b-1). G8 (tests/test_g8_thresholds.py) asserts every one
# is referenced somewhere and every reference resolves to an entry here.

high_value_limit:
  value: 5000
  unit: AUD
  description: >
    High-value claim threshold (T4.4), and the per-line ceiling ("no single line
    may itself exceed this") in the T5.1 split-claim test.
  used_by: [T4.4, T5.1]
  effective_date: "2026-09-23"
  provenance:
    type: analyst-set
    pending_policy_confirmation: true

split_aggregate_threshold:
  value: 5000
  unit: AUD
  description: Aggregate group/window sum threshold for T5.1 split-claim detection.
  used_by: [T5.1]
  effective_date: "2026-09-23"
  provenance:
    type: analyst-set
    pending_policy_confirmation: true

split_window_days:
  value: 3
  unit: days
  description: T5.1 sliding-window length [d, d+2] (3 calendar days inclusive).
  used_by: [T5.1]
  effective_date: "2026-09-23"
  provenance:
    type: analyst-set
    pending_policy_confirmation: true

entertainment_internal_limit:
  value: 40
  unit: AUD
  description: T3.3b per-head entertainment limit when every attendee is internal.
  used_by: [T3.3b]
  effective_date: "2026-09-23"
  provenance:
    type: analyst-set
    pending_policy_confirmation: true

entertainment_external_limit:
  value: 80
  unit: AUD
  description: T3.3b per-head entertainment limit when any attendee is external.
  used_by: [T3.3b]
  effective_date: "2026-09-23"
  provenance:
    type: analyst-set
    pending_policy_confirmation: true

late_booking_domestic_days:
  value: 7
  unit: days
  description: T3.3a domestic-travel "late booking" advance-purchase threshold.
  used_by: [T3.3a_dom]
  effective_date: "2026-09-23"
  provenance:
    type: analyst-set
    pending_policy_confirmation: true

late_booking_international_days:
  value: 14
  unit: days
  description: T3.3a international/Trans-Tasman "late booking" advance-purchase threshold.
  used_by: [T3.3a_int]
  effective_date: "2026-09-23"
  provenance:
    type: analyst-set
    pending_policy_confirmation: true

very_late_booking_days:
  value: 3
  unit: days
  description: T3.3a "very late booking" advance-purchase threshold, any travel class.
  used_by: [T3.3a_very_late]
  effective_date: "2026-09-23"
  provenance:
    type: analyst-set
    pending_policy_confirmation: true

instant_approval_minutes:
  value: 1
  unit: minutes
  description: T6.1a "instant approval" threshold (minutes from receipt view to approval).
  used_by: [T6.1a]
  effective_date: "2026-09-23"
  provenance:
    type: analyst-set
    pending_policy_confirmation: true

