# Tier B historical regression comparison (CLAUDE.md §5): "the gate is 'no
# unexplained divergence', not 'matches computation.py'". This is NOT the
# correctness gate -- Surface 1 (a hand-verified oracle, P4) is -- because
# reference_app/src/computation.py has documented semantic defects (CLAUDE.md
# §0.2) that must not be reproduced. It is a regression test that every
# difference between the new engine and the old one is explained by a known
# defect or a deliberate spec correction, never silent.
#
# old/new values below were GENERATED BY RUNNING, not written by hand:
# reference_app/src/computation.py's functions against the real
# synthetic_data/ files (via reference_app/src/data_loader.load_all_files),
# with EXCO_MEMBERS monkeypatched in both `src.data_loader` and
# `src.computation` to the 11 synthetic ExCo display names
# (skills/tne_exco/reference/exco_display_names.yaml); and the new engine via
# execute_skill() over the same files (tests/test_skill_tne.py's fixture,
# audit period 2025-01-01..2026-04-30). tests/test_regression_computation.py
# recomputes both at test time and asserts they match what is recorded here,
# so a value going stale here fails the test rather than silently drifting.
#
# `old` is either the number computation.py produced, or the literal string
# "ERROR: <exception>" when the function raised against real data (the
# function is called defensively in the test -- CLAUDE.md §0.2 "catch and
# record exceptions ... rather than crashing" -- never papered over).
# `new` is the new engine's corresponding plan.yaml metric(s), summed where
# computation.py reports one number the new engine now correctly splits.

tests:
  T3.1a:
    old: 85
    new: 85
    divergent: false
    explanation: >
      Both filter travel_requests_no_expense to the same 11 ExCo display
      names with no other population difference for this test -- the
      ID-vs-name distinction (spec §0 "Name-only sources") does not bite here
      because computation.py never resolves an Employee ID for this source
      either; it matches on name, same as the spec's declared exception.
    spec_ref: "docs/specs/SKILL-001_test_specification.md T3.1a"

  T3.1b:
    old: 0
    new: 8
    divergent: true
    explanation: >
      computation.py left-joins booking_detail to travel_request_segment on
      employee name ONLY, with no travel-class dimension -- so almost any
      booking by an ExCo member happens to match SOME travel request bearing
      that name, and the anti-join finds ~0 unmatched bookings. The spec's
      corrected join key is name + class (Dom/Int, derived from
      "Dom | Int" and "Expense Type" respectively -- spec T3.1b [PENDING]
      reading of "employee name + expense type"), which correctly requires a
      request of the SAME travel class and reveals 8 bookings with none.
    spec_ref: "docs/specs/SKILL-001_test_specification.md T3.1b Deviation"

  T3.2a:
    old: "ERROR: KeyError('Supplier Name')"
    new: 22
    divergent: true
    explanation: >
      computation.py reads booking_detail["Supplier Name"], a column that
      does not exist anywhere in this source -- booking_detail carries no
      supplier column at all (verified against the real synthetic_data/
      file's columns) -- so it raises KeyError and never produces a result.
      `new` is the sum of the four scorable T3.2a sub-tests
      (pref_dom_airline=1 + pref_int_airline=20 + pref_dom_car=1 +
      pref_int_car=0), which the spec's source correction runs on P_EXP's
      Vendor column instead (T3.2a_accom stays not_testable in both -- no
      preferred-hotel list exists in either).
    spec_ref: "docs/specs/SKILL-001_test_specification.md T3.2a Source correction"

  T3.3a:
    old: 2
    new: 0
    divergent: true
    explanation: >
      computation.py applies the international 14-day threshold to EVERY
      booking regardless of travel class ("Simplified: use <14 as general
      threshold" per its own docstring/comment) -- verified against real
      data, the only 2 bookings it flags are both Domestic with 7 and 8
      advance-purchase days, neither of which is late under the spec's
      correct 7-day DOMESTIC threshold (7 is not < 7). The class-aware
      primitive instances (T3.3a_dom + T3.3a_int, late_booking_count_dom=0 +
      late_booking_count_int=0) correctly find 0 late bookings on this data.
    spec_ref: "docs/specs/SKILL-001_test_specification.md T3.3a Threshold"

  T3.3b:
    old: 37
    new: 1
    divergent: true
    explanation: >
      computation.py matches Expense Type by substring against
      "Entertainment|Gifts|Business Meal" (case-insensitive) -- on this data
      that accidentally catches "Taxis to/from entertainment - Domestic and
      Local Travel" (24 rows) and "Gifts: Reward and Recognition" /
      "Gifts: Prepaid Gift Vouchers" (21 rows), none of which are the real
      entertainment-function expense types this test targets -- and it
      compares the FULL CLAIM amount against $40/$80 (the CLAUDE.md §0.2
      documented defect at computation.py:202), not per-head spend. `new`
      (ent_over_internal_count=0 + ent_over_external_count=1) uses the
      correct population (the two Staff/Client Function expense types) and
      the corrected per-head ratio (Entry Amount / Number of Attendees).
    spec_ref: "docs/specs/SKILL-001_test_specification.md T3.3b, CLAUDE.md §0.2"

  T4.1:
    old: 6
    new: 27
    divergent: true
    explanation: >
      computation.py counts missing_receipt register rows for the 11 ExCo
      display names directly, with NO audit-period filter and no join back
      to the expense population -- it trusts the register wholesale for that
      employee. The spec's anti_join_gap semi-joins the period-filtered
      P_EXP population against the register on a 5-column composite key
      (Employee ID, Report Legacy Key, Transaction Date, Expense Type,
      Amount), finding 27 qualifying expense lines within the tested window
      -- a different, precisely-matched population, not a superset/subset of
      the register's raw 6 ExCo rows.
    spec_ref: "docs/specs/SKILL-001_test_specification.md T4.1"

  T4.2:
    old: 0
    new: 198
    divergent: true
    explanation: >
      computation.py's fuzzy employee-column search never matches
      "Employee ID" (numeric, can't .isin() a list of name strings), so it
      falls through to the first OTHER column containing "employee" or
      "name" whose values overlap the ExCo name list -- "Attendee Name" --
      which flips the population to "attendee_validity rows where the
      ATTENDEE (not the claimant) is an ExCo member" (4 rows, verified
      against real data), then checks whether that same attendee-name field
      is merely non-null (always true, since it IS the attendee's name) --
      never testing for a missing attendee record at all. The spec instead
      scopes to entertainment-type P_EXP lines where the CLAIMANT (Employee
      ID) is ExCo (234 lines) and anti-joins to attendee_validity to find
      lines with no attendee record on file (198 of them).
    spec_ref: "docs/specs/SKILL-001_test_specification.md T4.2, CLAUDE.md §0.2 fuzzy column matching"

  T4.3:
    old: 132
    new: null
    divergent: true
    explanation: >
      compute_test_4_3_cached() returns a hardcoded `flagged: 132` --
      CLAUDE.md §0.2's named example of a placeholder that "moves to the
      classify node in P6" and must never be ported as a number. T4.3 is
      `not_testable` in the new engine (plan.yaml, reason "classification
      endpoint not yet wired (P6 classify node)") until P6 wires the real
      GPT-OSS classification.
    spec_ref: "docs/specs/SKILL-001_test_specification.md T4.3, CLAUDE.md §0.2"

  T4.4:
    old: 38
    new: 38
    divergent: false
    explanation: >
      Both find the same 38 lines exceeding $5,000 on this data even though
      the populations differ in principle (computation.py's `combined`
      concatenates prepared+approved -- double-counting the 23 rows in both
      sets, spec §0 P_EXP -- while the new engine's p_exp is a proper set
      union): none of the 23 double-counted rows happen to exceed $5,000 in
      this synthetic dataset, so the count and amount both happen to match
      exactly. This is a coincidence of the data, not evidence the
      double-count is harmless in general (see CLAUDE.md §0.3).
    spec_ref: "docs/specs/SKILL-001_test_specification.md T4.4, CLAUDE.md §0.5 currency/population"

  T5.1:
    old: 8
    new: 0
    divergent: true
    explanation: >
      computation.py's same-day detail has 4 groups (8 lines, its own
      claim_count.sum()) -- verified against real data, all 4 are explained:
      one (Employee 50079, Singapore Airlines, 2024-12-10) is entirely
      OUTSIDE the audit period (computation.py applies no period filter
      anywhere in this test), and the other three (Employee 51475/Collins
      Square, 51599/Mobile World Congress, 52394/Sofitel Barcelona) each
      contain at least one individual line already exceeding $5,000 on its
      own (e.g. $9,966.99, $5,085.00, $5,132.32) -- under the spec's
      corrected definition (T5.1 [PENDING]: "a split is by definition made
      of parts that are each under the limit") a group containing an
      already-high-value line is not a split, it is a high-value claim
      (T4.4). computation.py's window variant is a separate, more severe
      defect (CLAUDE.md §0.2 computation.py:365: sums the WHOLE
      employee/vendor/type group once any pair falls within 2 days, with no
      per-line ceiling), which is why its window count (355 lines) is even
      more inflated and is not reconciled line-by-line here.
    spec_ref: "docs/specs/SKILL-001_test_specification.md T5.1, CLAUDE.md §0.2 computation.py:365"

  T5.2:
    old: 114
    new: 60
    divergent: true
    explanation: >
      computation.py keys duplicate detection on employee NAME (not ID),
      applies no exclude_within itemisation rule (so lines sharing a Parent
      Key -- one entry itemised into several lines -- are miscounted as
      duplicates), and includes negative/zero-amount rows (credits and
      reversals cannot duplicate a positive claim). It also counts LINES,
      not duplicate GROUPS (spec's declared scoring unit). The spec's
      duplicate_detection primitive excludes same-Parent-Key itemisations,
      restricts to amount > 0, and reports both duplicate_groups (29) and
      duplicate_lines (60, the new engine's own line count for comparison).
    spec_ref: "docs/specs/SKILL-001_test_specification.md T5.2 Deviation"

  T6.1a:
    old: 100.0
    new: 82.7
    divergent: true
    explanation: >
      computation.py looks for "Report Viewed Receipts"/"Entry Viewed
      Receipts", columns that do not exist in approval_aging (the real
      columns are "Report Receipt Viewed"/"All Entry Receipts Viewed") --
      verified against real data, this silently sets Receipt_Viewed=0 for
      EVERY row, so its own no-review percentage is exactly 100.0% by
      construction, not a genuine finding. It also applies no audit-period
      filter (total=801 vs the new engine's period-filtered
      approver_total_reports=799). The spec reads the real column names and
      finds a genuine (still high, but not total) 82.7% no-receipt-viewed
      rate.
    spec_ref: "docs/specs/SKILL-001_test_specification.md T6.1a Receipt viewed"

  T6.1c:
    old: 0
    new: 3
    divergent: true
    explanation: >
      compute_test_6_1c() returns a hardcoded `exceptions: 0`, "Based on
      audit findings" -- CLAUDE.md §0.2's named example of a placeholder
      that "is now computed" (:529). The spec genuinely evaluates
      "Is Attendee also in Hierarchy?" over ExCo claimants' attendee rows
      and finds 3 real exceptions on this data.
    spec_ref: "docs/specs/SKILL-001_test_specification.md T6.1c Deviation, CLAUDE.md §0.2"

  T6.1d:
    old: 474
    new: 4
    divergent: true
    explanation: >
      computation.py checks `"Country" in df_per_diem.columns`, but the real
      per-diem file's column is "Country/Region" -- verified against real
      data, the exact-name check always fails, so it falls straight to the
      hardcoded `aus_rate = 500` fallback (CLAUDE.md §0.2's named example)
      and never reads the real Australia rate (126 S$/day) or converts
      SGD->AUD at all. It then compares EVERY employee-day's total (mixing
      domestic AND international spend, and the double-counted
      prepared+approved concat population) against that single flat $500
      AUD figure, flagging 474 employee-days. The spec derives each row's
      country, looks up its real per-diem rate, converts SGD->AUD at the
      transaction month's RBA rate, and finds 2 domestic + 2 international
      genuine exceedances (daily_over_count_dom + daily_over_count_int).
    spec_ref: "docs/specs/SKILL-001_test_specification.md T6.1d, CLAUDE.md §0.2 aus_rate = 500"
